name: postgres
title: PostgreSQL
icon: postgres

services:
- name: postgres
  title: PostgreSQL
  service: postgres
  volumes:
  - name: data
    size: 20

- name: adminer
  title: Adminer
  service: adminer
  disabled: true
  links:
  - name: db
    service: postgres

- name: pgadmin
  title: pgAdmin
  service: pgadmin
  disabled: true
  links:
  - name: db
    service: postgres
